# Q4OS package manifest - machine readable metadata for build tooling and agents
source="q4os-mxtools-common"
kind="external"
binaries="q4os-mxtools-common q4os-mxtools-plasma q4os-mxtools-trinity"
targets="deb12 deb13"
publish_repo="qexa:mxtools"
upstream_url="https://mxlinux.org"
upstream_watch="deb:http://mxrepo.com/mx/repo/ <codename> main"
watch_pkg="mx-tools"
notes="publish_repo naming caveat (confirmed live 2026-08-10): the per-app
qexarepo/mxtools instance uses suite name 'mxtools' (trixie-mxtools-cn,
matching this field), but the older shared qextrepo instance carries this
app-group's bookworm/bullseye/buster content under a DIFFERENT suite name,
'mx' (bookworm-mx-cn, bullseye-mx-cn, buster-mx-cn), not 'mxtools'.
publishdebs.sh's qexa fallback logic looks up the SAME suite name in both
instances, so as configured this will route trixie correctly via qexarepo
but will NOT find the qextrepo bookworm/bullseye/buster content (skipped
with a warning) until the suite naming is reconciled (rename qextrepo's
mx-cn suites to mxtools-cn, or vice versa) - flagged for the owner, not
fixed here."
